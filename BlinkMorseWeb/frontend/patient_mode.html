<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Mode - Blink Morse Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css?v=7">

    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <!-- Modular Components -->
    <script src="/js/faceMeshRenderer.js"></script>
    <script src="/js/blinkDetector.js"></script>
</head>

<body>
    <div class="container fade-in">
        <div class="text-center mb-4">
            <h1>🏥 Patient Mode</h1>
            <p id="userInfo" style="font-size: 1.2rem; color: var(--text-light);"></p>
        </div>

        <div class="patient-layout">
            <!-- Left: Camera Feed & Controls -->
            <div class="camera-section">
                <!-- Status Panel -->
                <div class="status-panel">
                    <h3>Status</h3>
                    <div id="statusIndicator" class="status-indicator status-idle">
                        <span class="status-dot" style="background: var(--status-idle);"></span>
                        <span id="statusText">Ready to start</span>
                    </div>
                </div>

                <!-- Video Feed -->
                <div class="video-container">
                    <video id="videoFeed" autoplay playsinline style="display: none;"></video>
                    <canvas id="canvasOutput"></canvas>
                    <div class="video-overlay">
                        <div class="ear-display">
                            EAR: <span id="earValue">--</span>
                        </div>
                        <div class="blink-feedback">
                            <div class="output-label">Blinks Detected</div>
                            <div id="blinkSymbols" class="morse-display">...</div>
                        </div>
                        <div class="morse-display">
                            <div class="output-label">Current Pattern</div>
                            <span id="morsePattern">--</span>
                        </div>
                    </div>
                </div>

                <!-- Output Panel -->
                <div class="output-panel">
                    <div class="output-label">Select Output Language</div>
                    <select id="languageSelect" class="form-input"
                        style="max-width: 260px; margin-bottom: 10px;">
                        <option value="en">English</option>
                        <option value="ta">Tamil</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="bn">Bengali</option>
                        <option value="mr">Marathi</option>
                        <option value="gu">Gujarati</option>
                    </select>

                    <div class="output-label">Current Word</div>
                    <div id="currentWord" class="output-text">--</div>

                    <div class="output-label mt-3">Full Message</div>
                    <div id="fullMessage" class="output-text">--</div>

                    <div class="output-label mt-3">Translated Text</div>
                    <div id="translatedText" class="output-text"
                        style="min-height: 80px; font-size: 1.4rem; line-height: 1.5; word-wrap: break-word; background: rgba(0, 0, 0, 0.25); border-radius: 10px; padding: 10px; border: 1px solid rgba(255, 255, 255, 0.15); color: #f0f0f0; text-align: left;">
                        --
                    </div>

                    <div class="output-label mt-3">Audio Output</div>
                    <audio id="audioPlayer" controls style="width: 100%;">
                        Your browser does not support the audio element.
                    </audio>
                </div>

                <!-- Controls -->
                <div class="control-panel">
                    <button id="startBtn" class="btn btn-success">
                        ▶️ Start Detection
                    </button>
                    <button id="resetBtn" class="btn btn-warning" disabled>
                        🔄 Reset
                    </button>
                    <button id="repeatBtn" class="btn btn-info" disabled>
                        🔁 Repeat Speech
                    </button>
                    <button id="stopBtn" class="btn btn-danger" disabled>
                        ⏹️ Stop
                    </button>
                </div>

                <div class="control-panel">
                    <button class="btn btn-warning" onclick="backToMenu()">
                        ← Back to Menu
                    </button>
                </div>
            </div>

            <!-- Right: Patient Commands Reference -->
            <div class="morse-reference">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="mb-0">Quick Commands</h3>
                    <button class="btn btn-sm btn-outline-light" onclick="openEditModal()">✏️ Edit</button>
                </div>
                <p class="text-light mb-3">
                    Blink these patterns for instant communication
                </p>

                <div id="commandsList">
                    <!-- Populated by JavaScript -->
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Commands Modal -->
    <div id="editCommandsModal" class="modal-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div class="modal-content text-light p-4 rounded bg-dark border border-secondary shadow-lg"
            style="max-width: 500px; width: 90%;">
            <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-2 mb-3">
                <h4 class="mb-0">Edit Commands</h4>
                <button class="btn btn-sm btn-outline-danger" onclick="closeEditModal()">✖</button>
            </div>

            <div id="editCommandsList" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;">
                <!-- Filled via JS -->
            </div>

            <div class="add-command-form d-flex gap-2 align-items-center" style="flex-wrap: nowrap;">
                <input type="text" id="newCommandPattern" class="form-input" placeholder="Pattern (e.g. .-)"
                    style="flex: 1; min-width: 0;">
                <input type="text" id="newCommandText" class="form-input" placeholder="Action (e.g. HELP)"
                    style="flex: 1; min-width: 0;">
                <button class="btn btn-primary" onclick="addNewCommand()" style="white-space: nowrap;">Add</button>
            </div>

            <div class="mt-4 text-end border-top border-secondary pt-3">
                <button class="btn btn-secondary me-2" onclick="closeEditModal()">Cancel</button>
                <button id="saveCommandsBtn" class="btn btn-success" onclick="saveCommands()">💾 Save Changes</button>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/patient_mode.js"></script>
    <script src="/js/patient_commands_editor.js"></script>
    <script src="/js/working_fx.js"></script>
</body>

</html>
